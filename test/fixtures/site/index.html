<!doctype html>
<html lang="en">
<head>

<title>Pebble Tasks</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1f23; background: #ffffff; }

<body>
<header><h1>Pebble Tasks</h1><p>Three things for today.</p></header>
<main>
  <ul>
    <li>Water the fern on the windowsill</li>
    <li>Return the library book about lighthouses</li>

  </ul>
  <div class="row">
    <button type="button">Add task</button>
    <button type="button" class="icon" aria-label="Settings">⚙</button>
  </div>
  <p><a href="/broken.html">See the messy page</a></p>
