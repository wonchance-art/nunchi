<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kettle Notes</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #111827; background: #ffffff; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  .card { padding: 12px; margin: 0 0 12px; background: #e5e7eb; border: 1px solid #9ca3af; border-radius: 8px; }
  .muted { color: #4b5563; font-size: 14px; }
  button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #2563eb; color: #ffffff; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Kettle Notes</h1>
  <div class="card"><p>Buy loose-leaf tea for the office tin</p><p class="muted">Tuesday</p></div>
  <div class="card"><p>Descale the kettle before the weekend</p><p class="muted">Friday</p></div>
  <button type="button">Add note</button>
  <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" fill="#4b5563"/></svg>
</main>
</body>
</html>
