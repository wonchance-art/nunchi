# Tests on every supported OS and Node version, a fresh install exactly as a plugin user gets it
# (no node_modules, `nunchi setup`) on Linux, macOS and Windows, and the benchmark gates. Actions are pinned to commit SHAs.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NUNCHI_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node src/cli.mjs setup --no-browser
      - name: Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo node node_modules/playwright-core/cli.js install-deps chromium
      - run: node src/cli.mjs setup
      # the tests in a temporary folder of their own, which must be empty after them (scripts/tmp-leftovers.mjs)
      - run: node scripts/tmp-leftovers.mjs npm test

  fresh-install:
    name: fresh install (as a plugin user gets it, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NUNCHI_REQUIRE_BROWSER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Copy the repository without node_modules
        run: mkdir "$RUNNER_TEMP/fresh" && git archive HEAD | tar -x -C "$RUNNER_TEMP/fresh"
      - name: Not set up yet is reported, not crashed
        working-directory: ${{ runner.temp }}/fresh
        run: |
          if node src/cli.mjs setup --check; then echo "expected not ready"; exit 1; fi
      - working-directory: ${{ runner.temp }}/fresh
        run: node src/cli.mjs setup --no-browser
      - name: Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/fresh
        run: sudo node node_modules/playwright-core/cli.js install-deps chromium
      - working-directory: ${{ runner.temp }}/fresh
        run: node src/cli.mjs setup
      - working-directory: ${{ runner.temp }}/fresh
        run: node --test test/cli-runs.test.mjs test/setup.test.mjs

  plugin:
    name: plugin manifests (claude plugin validate --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_TELEMETRY: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # the Claude Code CLI, pinned, for this check only (it is no dependency of nunchi)
      - run: npm install --global @anthropic-ai/claude-code@2.1.299
      - run: npm run validate:plugin

  bench:
    name: benchmark gates (Pebble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node src/cli.mjs setup --no-browser
      - run: sudo node node_modules/playwright-core/cli.js install-deps chromium
      - run: node src/cli.mjs setup
      - run: npm run bench
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: bench/out/
          if-no-files-found: ignore
